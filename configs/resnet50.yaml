# ============================================================
# resnet50.yaml  —  ResNet-50 hyperparameters
# Inherits all defaults from base_config.yaml
# ============================================================

model:
  name: "resnet50"
  pretrained: true
  pretrained_source: "IMAGENET1K_V2"
  # XAI target layer for Grad-CAM
  gradcam_target_layer: "layer4.2.relu"  # Final ReLU of last bottleneck block
  # Feature extraction layer for t-SNE / UMAP
  embedding_layer: "avgpool"             # 2048-d global average pool

transfer_learning:
  stage1:
    description: "Linear probe — backbone frozen, head trained only"
    epochs: 5
    optimizer: "adamw"
    lr: 1.0e-3
    weight_decay: 1.0e-4
    freeze_backbone: true

  stage2:
    description: "Fine-tuning — layer4 + layer3 unfrozen with differential LR"
    epochs: 45
    optimizer: "adamw"
    backbone_lr: 1.0e-5
    head_lr: 1.0e-4
    weight_decay: 1.0e-4
    # Unfreeze layer3 and layer4 (keep layer1, layer2, and stem frozen)
    unfreeze_layers: ["layer3", "layer4"]
    scheduler:
      type: "cosine_annealing_warm_restarts"
      T_0: 10
      T_mult: 2
      eta_min: 1.0e-7

dataloader:
  batch_size: 32                        # ResNet-50 is heavier — smaller batch

benchmark:
  warmup_iterations: 50
  measure_iterations: 300
  input_shape: [1, 3, 224, 224]

export:
  onnx_opset: 17
  dynamic_axes:
    input: {0: "batch_size"}
    output: {0: "batch_size"}
